name: Feature request
description: Suggest an improvement to the harness, UI, or benchmark
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is stuck today, and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should change (API, UI, dataset, docs)?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, or existing workarounds.
